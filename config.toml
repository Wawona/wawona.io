base_url = "https://wawona.io"
title = "Wawona"
description = "A native Wayland compositor for macOS, Linux, Android, and the iOS family"
theme = "apollo"
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]
taxonomies = [{ name = "tags" }]

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_path = true
include_content = true


[markdown]
external_links_target_blank = true

[markdown.highlighting]
theme = "solarized-dark"

[extra]
index_format = "elasticlunr_javascript"

author = "Wawona Team"
theme = "toggle" # dark, light, auto, toggle
favicon = "images/logo/Wawona-iOS-Default-1024x1024@1x.jpg"
logo = "images/logo/Wawona-iOS-Default-1024x1024@1x.jpg"
fancy_code = true
stylesheets = ["css/custom.css"]

menu = [
    { name = "/posts", url = "posts", weight = 1 },
    { name = "/docs", url = "docs", weight = 2 },
    { name = "/faq", url = "faq", weight = 3 },
    { name = "/gallery", url = "gallery", weight = 4 },
    { name = "/download", url = "download", weight = 5 },
]

socials = [
    { name = "github", url = "https://github.com/Wawona/Wawona", icon = "github" },
]

toc = true

# Donate: GitHub Sponsors is primary. Ko-fi is the alternative.
# Amount and monthly vs one-time are query params on the Sponsors URL.
github_sponsors_user = "aspauldingcode"
kofi_url = "https://ko-fi.com/aspauldingcode"

# Donation goal. The site header and the top donate banner show progress
# toward this amount. Update donation_raised_usd by hand after checking
# GitHub Sponsors. GitHub does not publish a public sponsorship total.
donation_goal_usd = 50000
donation_raised_usd = 0

# Download beta survey POST (Vercel). Token: pass secretspec/shared/default/SURVEY_GITHUB_TOKEN
# Inbox: private github.com/Wawona/beta-survey
# Gallery image catalog is generated at data/gallery.toml (scripts/check-gallery-refs.py).
survey_endpoint = "https://wawona-beta-survey.vercel.app/api/survey"
