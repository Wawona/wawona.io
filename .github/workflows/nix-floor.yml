name: Nix floor

on:
  push:
    branches: [development, master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Nix floor
    permissions:
      contents: read
      id-token: write
    uses: Wawona/Wawona/.github/workflows/nix-repo-floor.yml@9d381b572ef90952c6bf343b9b5a38e2bb8a79b2
