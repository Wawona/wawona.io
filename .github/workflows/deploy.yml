# Workflow to build and deploy a Zola site to GitHub Pages
name: Deploy Zola site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  # Refresh Ko-fi + GitHub Sponsors totals without a content push.
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0    # Fetch all history for git-related variables

      - name: Install Zola
        run: |
          # Keep in sync with the nixpkgs zola the repo builds with locally.
          ZOLA_VERSION="0.22.1"
          curl -L https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/

      - name: Install curl-impersonate
        run: |
          # Ko-fi sits behind Cloudflare. Plain curl gets a challenge page.
          ver=2.2.3
          dir="$RUNNER_TEMP/curl-impersonate"
          mkdir -p "$dir"
          curl -fsSL -o /tmp/curl-impersonate.tar.gz \
            "https://github.com/lexiforest/curl-impersonate/releases/download/v${ver}/curl-impersonate-v${ver}.x86_64-linux-gnu.tar.gz"
          tar -xzf /tmp/curl-impersonate.tar.gz -C "$dir"
          bin="$(find "$dir" -type f -name 'curl_chrome*' | sort | tail -1)"
          test -n "$bin"
          echo "CURL_IMPERSONATE=$bin" >> "$GITHUB_ENV"

      - name: Fetch donation totals
        env:
          GH_TOKEN: ${{ github.token }}
          SPONSORS_READ_TOKEN: ${{ secrets.SPONSORS_READ_TOKEN }}
        run: python3 scripts/fetch_donation_totals.py

      - name: Build
        run: zola build --output-dir ./public

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./public

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
